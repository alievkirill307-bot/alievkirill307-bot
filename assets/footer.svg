<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Mission passed. Respect plus. See you in Leonida.">
  <defs>
    <linearGradient id="skyGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF5B32" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#C41877" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#06020D" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="mission" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF4E0"/>
      <stop offset="0.35" stop-color="#FFD166"/>
      <stop offset="0.7" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#FF2D95"/>
      <animate attributeName="x1" values="-0.3;0.2;-0.3" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.7;1.2;0.7" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2D95"/>
      <stop offset="0.6" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#22E0D6"/>
    </linearGradient>

    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF2D95">
        <animate attributeName="stop-color" values="#FF2D95;#FF8A3D;#22E0D6;#FF2D95" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#22E0D6">
        <animate attributeName="stop-color" values="#22E0D6;#FF2D95;#FF8A3D;#22E0D6" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.2" fill="#000000" opacity="0.22"/>
    </pattern>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <clipPath id="card">
      <rect x="2" y="2" width="1196" height="216" rx="22" ry="22"/>
    </clipPath>

    <g id="palm" fill="none" stroke="#08020F" stroke-linecap="round">
      <path d="M0 0 C 7 -38 5 -78 -2 -120" stroke-width="8"/>
      <path d="M-2 -120 C -22 -148 -60 -156 -88 -142" stroke-width="6"/>
      <path d="M-2 -120 C 18 -150 56 -158 86 -144" stroke-width="6"/>
      <path d="M-2 -120 C -16 -158 -46 -184 -74 -190" stroke-width="5.5"/>
      <path d="M-2 -120 C 14 -160 44 -186 74 -192" stroke-width="5.5"/>
      <path d="M-2 -120 C -8 -164 -14 -196 -10 -222" stroke-width="5"/>
      <path d="M-2 -120 C 6 -166 12 -198 18 -224" stroke-width="5"/>
    </g>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="220" fill="#06020D"/>
    <rect width="1200" height="220" fill="url(#skyGlow)"/>

    <g fill="#FFFFFF" opacity="0.55">
      <circle cx="228" cy="34" r="1.2">
        <animate attributeName="opacity" values="0.1;0.8;0.1" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="402" cy="62" r="1">
        <animate attributeName="opacity" values="0.7;0.1;0.7" dur="6.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="846" cy="28" r="1.1">
        <animate attributeName="opacity" values="0.6;0.15;0.6" dur="4.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1010" cy="58" r="1">
        <animate attributeName="opacity" values="0.15;0.7;0.15" dur="5.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <ellipse cx="600" cy="200" rx="420" ry="90" fill="#FF2D95" opacity="0.16" filter="url(#glow)"/>

    <g transform="translate(96 222) scale(0.62)" opacity="0.95">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-1 0 0;1.4 0 0;-1 0 0" dur="10s" repeatCount="indefinite"/>
        <use href="#palm"/>
      </g>
    </g>
    <g transform="translate(1104 222) scale(-0.58 0.58)" opacity="0.95">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="1 0 0;-1.4 0 0;1 0 0" dur="12s" repeatCount="indefinite"/>
        <use href="#palm"/>
      </g>
    </g>

    <g font-family="'Arial Black', 'Segoe UI Black', Impact, sans-serif" font-weight="900" text-anchor="middle">
      <text x="600" y="102" font-size="46" letter-spacing="10" fill="#FF7A3D" opacity="0.4" filter="url(#glow)">MISSION PASSED</text>
      <text x="600" y="102" font-size="46" letter-spacing="10" fill="url(#mission)">MISSION PASSED</text>
      <text x="600" y="102" font-size="46" letter-spacing="10" fill="url(#sweep)" opacity="0.8">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite"/>
        MISSION PASSED
      </text>
    </g>

    <g font-family="'Fira Code', Consolas, 'Courier New', monospace" text-anchor="middle">
      <text x="600" y="138" font-size="17" letter-spacing="9" fill="#FF2D95">RESPECT +</text>
      <text x="600" y="196" font-size="10" letter-spacing="4" fill="#FFF4E0" opacity="0.5">KIRILL ALIEV · FULL-STACK DEVELOPER · SEE YOU IN LEONIDA</text>
    </g>

    <rect x="440" y="156" width="320" height="5" rx="2.5" fill="#2A0F3A"/>
    <rect x="440" y="156" width="0" height="5" rx="2.5" fill="url(#bar)">
      <animate attributeName="width" values="0;320;320" keyTimes="0;0.75;1" dur="7s" repeatCount="indefinite"/>
    </rect>

    <rect x="-260" y="-40" width="180" height="300" fill="url(#sweep)" opacity="0.5" transform="skewX(-18)">
      <animate attributeName="x" values="-280;1260" dur="10s" repeatCount="indefinite"/>
    </rect>

    <rect width="1200" height="220" fill="url(#scan)" opacity="0.45"/>
  </g>

  <rect x="2" y="2" width="1196" height="216" rx="22" ry="22" fill="none" stroke="url(#frame)" stroke-width="2"/>
</svg>
