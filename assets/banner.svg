    <g transform="translate(34 254)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-1.2 0 0;1.2 0 0;-1.2 0 0" dur="9s" repeatCount="indefinite"/>
        <use href="#palm" transform="scale(0.84)"/>
      </g>
    </g>
    <g transform="translate(1168 254)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="1 0 0;-1 0 0;1 0 0" dur="11s" repeatCount="indefinite"/>
        <use href="#palm" transform="scale(-0.8 0.8)"/>
      </g>
    </g>
    <g transform="translate(506 256) scale(0.36)" opacity="0.85">
      <use href="#palm"/>
    </g>

    <g font-family="'Fira Code', Consolas, 'Courier New', monospace" fill="#22E0D6">
      <text x="104" y="56" font-size="12" letter-spacing="6" opacity="0.9">
        // LEONIDA STATE //
        <animate attributeName="opacity" values="0.9;0.55;0.9" dur="6.5s" repeatCount="indefinite"/>
      </text>
    </g>

    <g font-family="'Arial Black', 'Segoe UI Black', Impact, sans-serif" font-weight="900" letter-spacing="1" transform="translate(106 0) skewX(-5)">
      <text x="0" y="158" font-size="82" fill="#08020F" opacity="0.55" transform="translate(6 8)">KIRILL</text>
      <text x="0" y="236" font-size="82" fill="#08020F" opacity="0.55" transform="translate(6 8)">ALIEV</text>

      <text x="0" y="158" font-size="82" fill="#22E0D6" opacity="0.35" transform="translate(-4 0)">KIRILL</text>
      <text x="0" y="236" font-size="82" fill="#22E0D6" opacity="0.35" transform="translate(-4 0)">ALIEV</text>
      <text x="0" y="158" font-size="82" fill="#FF2D95" opacity="0.4" transform="translate(4 0)">KIRILL</text>
      <text x="0" y="236" font-size="82" fill="#FF2D95" opacity="0.4" transform="translate(4 0)">ALIEV</text>

      <text x="0" y="158" font-size="82" fill="url(#chrome)" stroke="#16021F" stroke-width="9" paint-order="stroke">KIRILL</text>
      <text x="0" y="236" font-size="82" fill="url(#chrome)" stroke="#16021F" stroke-width="9" paint-order="stroke">ALIEV</text>

      <text x="0" y="158" font-size="82" fill="url(#shine)">KIRILL</text>
      <text x="0" y="236" font-size="82" fill="url(#shine)">ALIEV</text>
    </g>

    <g transform="translate(0 0)">
      <polygon points="92,252 470,252 454,292 76,292" fill="url(#ribbon)"/>
      <polygon points="92,252 470,252 466,260 88,260" fill="#FFF4E0" opacity="0.5"/>
      <text x="273" y="280" text-anchor="middle" font-family="'Fira Code', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" letter-spacing="5" fill="#16021F">FULL-STACK DEVELOPER</text>
    </g>

    <g font-family="'Fira Code', Consolas, 'Courier New', monospace" fill="#FFF4E0">
      <text x="104" y="336" font-size="12" letter-spacing="4" opacity="0.82">NODE.JS · LARAVEL · REACT · PHOTON</text>
      <text x="1100" y="336" text-anchor="end" font-size="12" letter-spacing="4" opacity="0.62">VICE CITY · LEONIDA</text>
    </g>

    <rect x="-320" y="-80" width="260" height="560" fill="url(#sweep)" opacity="0.9" transform="skewX(-18)">
      <animate attributeName="x" values="-340;1260" dur="12s" repeatCount="indefinite"/>
    </rect>

    <rect x="0" y="-60" width="1200" height="34" fill="#FFF4E0" opacity="0.045">
      <animate attributeName="y" values="-40;400" dur="9s" repeatCount="indefinite"/>
    </rect>

    <rect width="1200" height="380" fill="url(#scan)" opacity="0.55"/>
    <rect width="1200" height="380" fill="url(#vignette)"/>
    <rect width="1200" height="380" fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="26" filter="url(#soft)"/>
  </g>

  <rect x="2" y="2" width="1196" height="376" rx="26" ry="26" fill="none" stroke="url(#frame)" stroke-width="2.5"/>
</svg>
