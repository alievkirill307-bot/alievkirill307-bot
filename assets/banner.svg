<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Kirill Aliev — full-stack developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a1a10"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39FF14"/>
      <stop offset="0.45" stop-color="#7CFFB2"/>
      <stop offset="0.55" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#39FF14"/>
      <animate attributeName="x1" values="-1;1;-1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2;0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39FF14">
        <animate attributeName="stop-color" values="#39FF14;#00E5FF;#7C4DFF;#39FF14" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#00E5FF">
        <animate attributeName="stop-color" values="#00E5FF;#7C4DFF;#39FF14;#00E5FF" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#7C4DFF">
        <animate attributeName="stop-color" values="#7C4DFF;#39FF14;#00E5FF;#7C4DFF" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#39FF14" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#39FF14" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#39FF14" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39FF14" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39FF14" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#39FF14" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="card">
      <rect x="3" y="3" width="894" height="214" rx="26" ry="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="220" fill="url(#bg)"/>
    <rect width="900" height="220" fill="url(#grid)"/>

    <circle cx="760" cy="110" r="150" fill="url(#halo)">
      <animate attributeName="r" values="140;170;140" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
    </circle>

    <g stroke="#39FF14" stroke-opacity="0.28" fill="none" stroke-width="1.2">
      <circle cx="762" cy="110" r="54">
        <animate attributeName="r" values="48;62;48" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.35;0.05;0.35" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="762" cy="110" r="82">
        <animate attributeName="r" values="78;92;78" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.05;0.3;0.05" dur="7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g filter="url(#glow)">
      <circle cx="762" cy="110" r="6" fill="#39FF14"/>
    </g>
    <g fill="none" stroke="#00E5FF" stroke-width="2" stroke-opacity="0.85">
      <circle cx="762" cy="110" r="54">
        <animateMotion dur="6s" repeatCount="indefinite" path="M54,0 A54,54 0 1,1 -54,0 A54,54 0 1,1 54,0"/>
      </circle>
      <circle cx="762" cy="110" r="82">
        <animateMotion dur="11s" repeatCount="indefinite" path="M82,0 A82,82 0 1,0 -82,0 A82,82 0 1,0 82,0"/>
      </circle>
    </g>

    <g fill="#39FF14" opacity="0.75">
      <circle cx="90" cy="176" r="2.6">
        <animate attributeName="cy" values="176;164;176" dur="4.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="132" cy="188" r="2">
        <animate attributeName="cy" values="188;172;188" dur="5.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0.25;0.9" dur="5.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="176" cy="170" r="2.2">
        <animate attributeName="cy" values="170;154;170" dur="6.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.85;0.3" dur="6.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="228" cy="184" r="1.8">
        <animate attributeName="cy" values="184;168;184" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0.15;0.7" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="-320" y="0" width="320" height="220" fill="url(#sweep)" transform="skewX(-18)">
      <animate attributeName="x" values="-320;980" dur="9s" repeatCount="indefinite"/>
    </rect>

    <g font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" fill="#c9d1d9">
      <text x="64" y="86" font-size="13" letter-spacing="4" fill="#39FF14" opacity="0.85">&lt;hello world /&gt;</text>

      <text x="64" y="146" font-size="46" font-weight="700" fill="url(#shine)" letter-spacing="1">
        KIRILL ALIEV
        <animate attributeName="opacity" values="1;0.82;1" dur="5s" repeatCount="indefinite"/>
      </text>

      <text x="64" y="182" font-size="15" fill="#8b949e" letter-spacing="1.5">
        full-stack developer · Node.js · Laravel · React
        <animate attributeName="fill" values="#8b949e;#b8c2cc;#8b949e" dur="6s" repeatCount="indefinite"/>
      </text>
    </g>

    <g fill="#39FF14" opacity="0.55">
      <rect x="64" y="54" width="34" height="3" rx="1.5">
        <animate attributeName="width" values="34;58;34" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <rect x="3" y="3" width="894" height="214" rx="26" ry="26" fill="none" stroke="url(#border)" stroke-width="2"/>
</svg>
