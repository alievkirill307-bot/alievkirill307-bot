<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Kirill Aliev — full-stack developer. GTA VI inspired neon sunset banner with palm trees, Miami skyline and chrome lettering.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06020D"/>
      <stop offset="0.22" stop-color="#170629"/>
      <stop offset="0.42" stop-color="#3C0A4A"/>
      <stop offset="0.6" stop-color="#8A1058"/>
      <stop offset="0.74" stop-color="#D41F5E"/>
      <stop offset="0.86" stop-color="#FF5B32"/>
      <stop offset="0.95" stop-color="#FF9E2C"/>
      <stop offset="1" stop-color="#FFC24B"/>
    </linearGradient>

    <radialGradient id="leftShade" cx="0.18" cy="0.46" r="0.72">
      <stop offset="0" stop-color="#06020D" stop-opacity="0.62"/>
      <stop offset="0.62" stop-color="#06020D" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#06020D" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF2A8"/>
      <stop offset="0.3" stop-color="#FFD166"/>
      <stop offset="0.58" stop-color="#FF8A3D"/>
      <stop offset="0.82" stop-color="#FF3D7F"/>
      <stop offset="1" stop-color="#E01F8A"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF7CAE" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#FF2D95" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF2D95" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A0B45"/>
      <stop offset="0.22" stop-color="#2A0733"/>
      <stop offset="0.6" stop-color="#130420"/>
      <stop offset="1" stop-color="#07010E"/>
    </linearGradient>

    <linearGradient id="mirror" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD166" stop-opacity="0.6"/>
      <stop offset="0.4" stop-color="#FF4D8D" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FF2D95" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.15" stop-color="#FFF4DA"/>
      <stop offset="0.32" stop-color="#FFC24B"/>
      <stop offset="0.48" stop-color="#FF7A3D"/>
      <stop offset="0.64" stop-color="#FF2D95"/>
      <stop offset="0.82" stop-color="#A32BE0"/>
      <stop offset="1" stop-color="#5B1BD6"/>
    </linearGradient>

    <linearGradient id="shine" x1="-0.5" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      <animate attributeName="x1" values="-0.7;0.35;-0.7" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.3;1.35;0.3" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2D95"/>
      <stop offset="0.55" stop-color="#FF7A18"/>
      <stop offset="1" stop-color="#FFC24B"/>
    </linearGradient>

    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF2D95">
        <animate attributeName="stop-color" values="#FF2D95;#FF8A3D;#22E0D6;#7A1BFF;#FF2D95" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#FFC24B">
        <animate attributeName="stop-color" values="#FFC24B;#22E0D6;#FF2D95;#FF8A3D;#FFC24B" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#22E0D6">
        <animate attributeName="stop-color" values="#22E0D6;#7A1BFF;#FF8A3D;#FF2D95;#22E0D6" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF4E0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFF4E0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFF4E0" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.46" r="0.78">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.2" fill="#000000" opacity="0.24"/>
    </pattern>

    <mask id="sunBands">
      <rect x="740" y="96" width="280" height="160" fill="#FFFFFF"/>
      <g fill="#000000">
        <rect x="740" y="214" width="280" height="3">
          <animate attributeName="y" values="214;210;214" dur="7s" repeatCount="indefinite"/>
        </rect>
        <rect x="740" y="228" width="280" height="5">
          <animate attributeName="y" values="228;224;228" dur="7s" repeatCount="indefinite"/>
        </rect>
        <rect x="740" y="241" width="280" height="7">
          <animate attributeName="y" values="241;237;241" dur="7s" repeatCount="indefinite"/>
        </rect>
      </g>
    </mask>

    <clipPath id="card">
      <rect x="2" y="2" width="1196" height="376" rx="26" ry="26"/>
    </clipPath>

    <clipPath id="skyArea">
      <rect x="0" y="0" width="1200" height="250"/>
    </clipPath>

    <clipPath id="waterArea">
      <rect x="0" y="250" width="1200" height="130"/>
    </clipPath>

    <g id="palm" fill="none" stroke="#08020F" stroke-linecap="round">
      <path d="M0 0 C 7 -38 5 -78 -2 -120" stroke-width="8"/>
      <path d="M-2 -120 C -22 -148 -60 -156 -88 -142" stroke-width="6"/>
      <path d="M-2 -120 C 18 -150 56 -158 86 -144" stroke-width="6"/>
      <path d="M-2 -120 C -16 -158 -46 -184 -74 -190" stroke-width="5.5"/>
      <path d="M-2 -120 C 14 -160 44 -186 74 -192" stroke-width="5.5"/>
      <path d="M-2 -120 C -8 -164 -14 -196 -10 -222" stroke-width="5"/>
      <path d="M-2 -120 C 6 -166 12 -198 18 -224" stroke-width="5"/>
      <g fill="#08020F" stroke="none">
        <circle cx="-10" cy="-116" r="5"/>
        <circle cx="6" cy="-114" r="4.5"/>
      </g>
    </g>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="#06020D"/>

    <rect width="1200" height="250" fill="url(#sky)"/>
    <rect width="780" height="380" fill="url(#leftShade)"/>

    <g fill="#FFFFFF">
      <circle cx="176" cy="38" r="1.4" opacity="0.7">
        <animate attributeName="opacity" values="0.1;0.85;0.1" dur="4.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="322" cy="72" r="1" opacity="0.5">
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="5.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="486" cy="34" r="1.2" opacity="0.6">
        <animate attributeName="opacity" values="0.8;0.15;0.8" dur="6.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="612" cy="86" r="1" opacity="0.5">
        <animate attributeName="opacity" values="0.15;0.7;0.15" dur="4.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="706" cy="52" r="1.3" opacity="0.6">
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="5.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1032" cy="42" r="1.2" opacity="0.7">
        <animate attributeName="opacity" values="0.9;0.2;0.9" dur="5.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1124" cy="96" r="1" opacity="0.5">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="972" cy="112" r="0.9" opacity="0.4"/>
    </g>

    <g clip-path="url(#skyArea)">
      <ellipse cx="880" cy="228" rx="310" ry="188" fill="url(#sunGlow)">
        <animate attributeName="rx" values="290;330;290" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;1;0.8" dur="8s" repeatCount="indefinite"/>
      </ellipse>

      <g mask="url(#sunBands)">
        <circle cx="880" cy="222" r="112" fill="url(#sunGrad)">
          <animate attributeName="r" values="110;115;110" dur="10s" repeatCount="indefinite"/>
        </circle>
      </g>

      <rect x="560" y="246" width="640" height="6" fill="#FFC24B" opacity="0.5" filter="url(#soft)"/>

      <g stroke="#08020F" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8">
        <path d="M0 0 q 7 -6 14 0 q 7 -6 14 0">
          <animateTransform attributeName="transform" type="translate" values="752 138;700 124;752 138" dur="19s" repeatCount="indefinite"/>
        </path>
        <path d="M0 0 q 6 -5 12 0 q 6 -5 12 0">
          <animateTransform attributeName="transform" type="translate" values="812 160;766 150;812 160" dur="23s" repeatCount="indefinite"/>
        </path>
        <path d="M0 0 q 5 -4 10 0 q 5 -4 10 0">
          <animateTransform attributeName="transform" type="translate" values="694 176;652 166;694 176" dur="17s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <g fill="#140723">
      <rect x="520" y="212" width="26" height="38"/>
      <rect x="550" y="186" width="34" height="64"/>
      <rect x="590" y="204" width="22" height="46"/>
      <rect x="618" y="168" width="40" height="82"/>
      <rect x="664" y="198" width="28" height="52"/>
      <rect x="700" y="180" width="18" height="70"/>
      <rect x="726" y="210" width="46" height="40"/>
      <rect x="780" y="190" width="24" height="60"/>
      <rect x="810" y="216" width="34" height="34"/>
      <rect x="950" y="200" width="30" height="50"/>
      <rect x="986" y="174" width="38" height="76"/>
      <rect x="1030" y="206" width="26" height="44"/>
      <rect x="1062" y="186" width="30" height="64"/>
      <rect x="1098" y="214" width="40" height="36"/>
      <rect x="1144" y="196" width="26" height="54"/>
    </g>

    <g stroke="#140723" stroke-width="2" stroke-linecap="round">
      <line x1="638" y1="168" x2="638" y2="140"/>
      <line x1="630" y1="154" x2="646" y2="154"/>
      <line x1="709" y1="180" x2="709" y2="150"/>
      <line x1="702" y1="164" x2="716" y2="164"/>
      <line x1="1005" y1="174" x2="1005" y2="146"/>
      <line x1="998" y1="158" x2="1012" y2="158"/>
    </g>

    <g fill="#FFC24B" opacity="0.55">
      <rect x="557" y="194" width="3" height="5"/>
      <rect x="566" y="206" width="3" height="5"/>
      <rect x="626" y="178" width="3" height="6"/>
      <rect x="640" y="194" width="3" height="6"/>
      <rect x="626" y="212" width="3" height="6"/>
      <rect x="734" y="220" width="4" height="5"/>
      <rect x="748" y="232" width="4" height="5"/>
      <rect x="994" y="186" width="3" height="6"/>
      <rect x="1006" y="204" width="3" height="6"/>
      <rect x="1068" y="198" width="3" height="5"/>
      <rect x="1106" y="224" width="4" height="5"/>
    </g>

    <g fill="#22E0D6" opacity="0.5">
      <rect x="600" y="214" width="3" height="5"/>
      <rect x="672" y="210" width="3" height="5"/>
      <rect x="1038" y="216" width="3" height="5"/>
      <rect x="1152" y="208" width="3" height="5"/>
    </g>

    <g fill="#FF2D95" opacity="0.55">
      <rect x="576" y="226" width="3" height="5"/>
      <rect x="790" y="202" width="3" height="5"/>
      <rect x="1078" y="226" width="3" height="5"/>
    </g>

    <rect x="0" y="248" width="1200" height="3" fill="#FFC24B" opacity="0.55" filter="url(#soft)"/>

    <g clip-path="url(#waterArea)">
      <rect x="0" y="250" width="1200" height="130" fill="url(#water)"/>

      <path d="M836 250 L924 250 L988 380 L772 380 Z" fill="url(#mirror)" opacity="0.7">
        <animate attributeName="opacity" values="0.5;0.85;0.5" dur="6s" repeatCount="indefinite"/>
      </path>
      <ellipse cx="880" cy="278" rx="86" ry="46" fill="url(#mirror)" filter="url(#soft)">
        <animate attributeName="rx" values="76;100;76" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.65;1;0.65" dur="6s" repeatCount="indefinite"/>
      </ellipse>

      <g stroke="#FF2D95" stroke-width="1" opacity="0.1">
        <line x1="880" y1="250" x2="0" y2="380"/>
        <line x1="880" y1="250" x2="180" y2="380"/>
        <line x1="880" y1="250" x2="380" y2="380"/>
        <line x1="880" y1="250" x2="580" y2="380"/>
        <line x1="880" y1="250" x2="780" y2="380"/>
        <line x1="880" y1="250" x2="980" y2="380"/>
        <line x1="880" y1="250" x2="1200" y2="380"/>
        <line x1="0" y1="272" x2="1200" y2="272"/>
        <line x1="0" y1="304" x2="1200" y2="304"/>
        <line x1="0" y1="348" x2="1200" y2="348"/>
      </g>

      <g stroke="#FFB0D0" stroke-linecap="round" opacity="0.75">
        <line x1="742" y1="268" x2="806" y2="268" stroke-width="2">
          <animate attributeName="opacity" values="0.15;0.75;0.15" dur="4.4s" repeatCount="indefinite"/>
          <animate attributeName="x1" values="738;750;738" dur="4.4s" repeatCount="indefinite"/>
          <animate attributeName="x2" values="802;814;802" dur="4.4s" repeatCount="indefinite"/>
        </line>
        <line x1="930" y1="284" x2="1010" y2="284" stroke-width="2.4">
          <animate attributeName="opacity" values="0.65;0.15;0.65" dur="5.6s" repeatCount="indefinite"/>
          <animate attributeName="x1" values="924;940;924" dur="5.6s" repeatCount="indefinite"/>
          <animate attributeName="x2" values="1004;1020;1004" dur="5.6s" repeatCount="indefinite"/>
        </line>
        <line x1="800" y1="302" x2="856" y2="302" stroke-width="1.8">
          <animate attributeName="opacity" values="0.2;0.7;0.2" dur="5s" repeatCount="indefinite"/>
        </line>
        <line x1="900" y1="320" x2="972" y2="320" stroke-width="2">
          <animate attributeName="opacity" values="0.55;0.1;0.55" dur="6.4s" repeatCount="indefinite"/>
        </line>
        <line x1="684" y1="330" x2="748" y2="330" stroke-width="1.6">
          <animate attributeName="opacity" values="0.15;0.55;0.15" dur="4.8s" repeatCount="indefinite"/>
        </line>
        <line x1="980" y1="352" x2="1052" y2="352" stroke-width="1.6">
          <animate attributeName="opacity" values="0.45;0.1;0.45" dur="4s" repeatCount="indefinite"/>
        </line>
      </g>

      <g stroke="#FF7A3D" stroke-linecap="round" opacity="0.18">
        <line x1="120" y1="290" x2="230" y2="290" stroke-width="2"/>
        <line x1="330" y1="318" x2="452" y2="318" stroke-width="2"/>
        <line x1="960" y1="300" x2="1080" y2="300" stroke-width="2"/>
